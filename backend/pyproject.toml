[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docai-backend"
version = "0.1.0"
description = "AI-powered Document & Multimedia Q&A Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.11.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "redis>=4.5.0",
    "google-genai>=0.2.2",
    "groq>=0.9.0",
    "faiss-cpu>=1.7.4",
    "pdfplumber>=0.10.0",
    "pymupdf>=1.22.0",
    "tiktoken>=0.5.0",
    "httpx>=0.24.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=app --cov-report=term-missing --cov-report=html:coverage_html --cov-fail-under=95"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
