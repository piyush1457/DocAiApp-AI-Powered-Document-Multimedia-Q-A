version: '3.8'

# Production override configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    image: nginx:alpine
    container_name: docai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL Certificates (Uncomment and configure Certbot for production)
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

  backend:
    # Use Gunicorn with Uvicorn workers for production-grade process management
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    ports: [] # Overrides and removes public port mapping
    expose:
      - "8000"
    environment:
      DEBUG: "false"
      ENVIRONMENT: production

  frontend:
    ports: [] # Overrides and removes public port mapping
    expose:
      - "80"

networks:
  app_network:
    driver: bridge
